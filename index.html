<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 资讯日报 · 每日自动更新</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --faint: #86868b;
    --link: #0066cc;
    --link-hover: #0071e3;
    --border: #e8e8ed;
    --accent-blue: #0a5dc2;
    --chip-blue: #e8f1fb; --chip-blue-t: #0a5dc2;
    --chip-purple: #f0edfc; --chip-purple-t: #5e4bc2;
    --chip-teal: #e4f4f0; --chip-teal-t: #0e7a62;
    --chip-amber: #fdf3e3; --chip-amber-t: #b45309;
    --chip-red: #fdecec; --chip-red-t: #c22626;
    --chip-gray: #f2f2f4; --chip-gray-t: #515154;
    --radius: 20px;
    --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 顶部导航 ---------- */
  nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(245, 245, 247, 0.82);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .nav-inner { max-width: 1050px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
  .nav-brand span { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .nav-links { display: flex; gap: 22px; font-size: 13px; color: var(--muted); }
  .nav-links a { color: var(--muted); text-decoration: none; transition: color .2s; }
  .nav-links a:hover { color: var(--text); }
  .nav-date { font-size: 12px; color: var(--faint); white-space: nowrap; }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .refresh-btn {
    border: 1px solid var(--border); background: #fff; color: var(--link);
    font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 980px;
    cursor: pointer; white-space: nowrap; transition: background .2s, border-color .2s, color .2s;
  }
  .refresh-btn:hover { background: var(--chip-blue); border-color: var(--chip-blue-t); color: var(--chip-blue-t); }
  .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Hero ---------- */
  .hero { padding: 44px 24px 24px; text-align: center; position: relative; overflow: hidden; }
  #hero-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .hero > *:not(#hero-canvas) { position: relative; z-index: 1; }
  .hero h1 { font-size: clamp(40px, 6.5vw, 72px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.06; margin-bottom: 12px; }
  .hero .hero-en {
    font-size: clamp(19px, 2.6vw, 28px);
    font-weight: 600; letter-spacing: -0.01em; line-height: 1.25;
    margin: 0 0 14px;
    background: linear-gradient(180deg, #1d1d1f 0%, #86868b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .hero .sub { font-size: clamp(15px, 2vw, 20px); color: var(--muted); max-width: 620px; margin: 0 auto 18px; line-height: 1.5; }
  .hero .sub { font-size: clamp(17px, 2.4vw, 24px); color: var(--muted); max-width: 620px; margin: 0 auto 20px; line-height: 1.4; }
  .hero .meta { font-size: 13px; color: var(--faint); display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .hero .meta .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34c759; margin-right: 6px; animation: pulse 2.2s infinite; vertical-align: 1px; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------- 今日热门总览 ---------- */
  .hot-section { max-width: 1050px; margin: 0 auto; padding: 56px 24px 8px; }
  .hot-list { display: flex; flex-direction: column; gap: 12px; }
  .hot-bar {
    display: flex; align-items: center; gap: 14px;
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 18px; text-decoration: none; color: var(--text);
    transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
  }
  .hot-bar:hover { transform: translateX(4px); box-shadow: 0 8px 20px rgba(0,0,0,0.07); border-color: rgba(0,0,0,0.12); }
  .hot-bar .chip { margin: 0; flex-shrink: 0; }
  .hot-bar-title { flex: 1; font-size: 15px; font-weight: 500; line-height: 1.4; }
  .hot-bar .bar-arrow { color: var(--faint); font-size: 18px; line-height: 1; }

  /* ---------- 分区 ---------- */
  .section { max-width: 1050px; margin: 0 auto; padding: 72px 24px 8px; }
  .sec-head { margin-bottom: 30px; }
  .sec-kicker { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--link); margin-bottom: 8px; }
  .section-batch-wrap { text-align: center; margin-top: 28px; }
  .section-batch-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fff; color: var(--link); border: 1px solid var(--border);
    font-size: 13px; font-weight: 500; padding: 9px 20px; border-radius: 980px;
    cursor: pointer; transition: background .2s, border-color .2s, transform .2s;
  }
  .section-batch-btn:hover { background: var(--chip-blue); border-color: var(--chip-blue-t); color: var(--chip-blue-t); transform: translateY(-1px); }
  .section-batch-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .batch-count { color: var(--faint); font-weight: 400; }
  .sec-head h2 { font-size: clamp(28px, 4vw, 44px); font-weight: 600; letter-spacing: -0.015em; line-height: 1.15; margin-bottom: 8px; }
  .sec-head p { font-size: 16px; color: var(--muted); max-width: 560px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 26px 26px 22px;
    cursor: pointer;
    display: flex; flex-direction: column;
    transition: transform .45s var(--ease), box-shadow .45s var(--ease), border-color .45s var(--ease);
    transform: translateY(0);
    position: relative; overflow: hidden;
  }
  .card::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.03));
    opacity: 0; transition: opacity .4s; pointer-events: none;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.1); }
  .card:hover::after { opacity: 1; }
  .card:active { transform: translateY(-2px) scale(0.99); }
  .card .chip { align-self: flex-start; font-size: 11px; font-weight: 600; border-radius: 7px; padding: 3px 9px; margin-bottom: 12px; letter-spacing: 0.01em; }
  .hot-badge {
    position: absolute; top: 16px; right: 16px;
    font-size: 11px; font-weight: 600; color: #b45309; background: #fdf3e3;
    border-radius: 7px; padding: 3px 9px; letter-spacing: 0.01em;
  }
  .chip.硬件与芯片 { background: var(--chip-blue); color: var(--chip-blue-t); }
  .chip.模型与产品 { background: var(--chip-purple); color: var(--chip-purple-t); }
  .chip.游戏AI { background: var(--chip-amber); color: var(--chip-amber-t); }
  .chip.机器人具身智能 { background: var(--chip-teal); color: var(--chip-teal-t); }
  .chip.行业政策 { background: var(--chip-red); color: var(--chip-red-t); }
  .chip.资本与市场 { background: var(--chip-gray); color: var(--chip-gray-t); }
  .card h3 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; margin-bottom: 10px; }
  .card .sum { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; flex: 1; }
  .card .foot { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--faint); }
  .card .more { color: var(--link); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
  .card .more::after { content: "›"; font-size: 16px; line-height: 1; transition: transform .3s; }
  .card:hover .more::after { transform: translateX(3px); }

  /* 滚动渐入 */
  .reveal { opacity: 0; transform: translateY(30px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  .empty-tip { font-size: 14px; color: var(--faint); padding: 40px; text-align: center; }

  /* ---------- 弹层 ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .35s;
    padding: 24px;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--card); border-radius: 26px;
    max-width: 720px; width: 100%; max-height: 86vh; overflow-y: auto;
    padding: 40px 42px 34px;
    transform: translateY(24px) scale(0.97);
    transition: transform .4s var(--ease);
    position: relative;
  }
  .overlay.open .modal { transform: none; }
  .modal .chip { font-size: 11px; font-weight: 600; border-radius: 7px; padding: 3px 9px; display: inline-block; margin-bottom: 14px; }
  .modal .m-date { font-size: 13px; color: var(--faint); margin-bottom: 10px; }
  .modal h2 { font-size: 28px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.3; margin-bottom: 18px; }
  .modal .m-sum { font-size: 16px; color: var(--muted); line-height: 1.65; margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .modal .m-detail { font-size: 15px; line-height: 1.8; color: var(--text); }
  .modal .m-detail p { margin-bottom: 14px; }
  .modal .m-src { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--faint); }
  .modal .btn-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--link); color: #fff; text-decoration: none;
    font-size: 13px; font-weight: 500; padding: 10px 20px; border-radius: 980px;
    transition: background .25s, transform .25s;
  }
  .modal .btn-link:hover { background: var(--link-hover); transform: translateY(-1px); }
  .modal .btn-link::after { content: "↗"; font-size: 14px; }
  .close-btn {
    position: absolute; top: 18px; right: 18px; width: 32px; height: 32px;
    border-radius: 50%; border: none; background: #f2f2f4; color: var(--muted);
    font-size: 16px; cursor: pointer; transition: background .2s, transform .2s;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .close-btn:hover { background: #e5e5ea; transform: rotate(90deg); }
  body.no-scroll { overflow: hidden; }

  footer { max-width: 1050px; margin: 0 auto; padding: 70px 24px 90px; text-align: center; font-size: 12px; color: var(--faint); }
  footer .sep { margin: 0 10px; }

  @media (max-width: 700px) {
    .nav-links { display: none; }
    .hero { padding-top: 60px; }
    .section { padding-top: 52px; }
    .grid { grid-template-columns: 1fr; }
    .modal { padding: 28px 22px 24px; }
    .modal h2 { font-size: 22px; }
  }

  /* ---------- 聊天助手 ---------- */
  .chat-launcher {
    position: fixed; right: 22px; bottom: 22px; z-index: 90;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--link); color: #fff; border: none; cursor: pointer;
    font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18); transition: transform .3s;
  }
  .chat-launcher:hover { transform: translateY(-3px); }
  .chat-launcher .info-icon {
    width: 22px; height: 22px; border: 2px solid #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; font-style: italic; line-height: 1;
  }
  .chat-panel {
    position: fixed; right: 22px; bottom: 86px; z-index: 95;
    width: 340px; max-width: calc(100vw - 44px); height: 520px; max-height: calc(100vh - 120px);
    background: #fff; border-radius: 20px; border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    display: flex; flex-direction: column; overflow: hidden;
    opacity: 0; pointer-events: none; transform: translateY(16px) scale(0.97);
    transition: opacity .3s var(--ease), transform .3s var(--ease);
  }
  .chat-panel.open { opacity: 1; pointer-events: auto; transform: none; }
  .chat-head {
    padding: 13px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; font-size: 15px;
  }
  .chat-head .badge { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34c759; margin-right: 8px; }
  .chat-close { border: none; background: #f2f2f4; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; }
  .chat-close:hover { background: #e5e5ea; }
  .chat-quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .chat-quick button {
    border: 1px solid var(--border); background: #f7f7f9; border-radius: 999px;
    padding: 5px 12px; font-size: 12px; color: var(--text); cursor: pointer;
    transition: background .2s, border-color .2s, color .2s;
  }
  .chat-quick button:hover { background: var(--chip-blue); border-color: var(--chip-blue-t); color: var(--chip-blue-t); }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .chat-msgs .msg { max-width: 85%; padding: 9px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .chat-msgs .msg.user { align-self: flex-end; background: var(--link); color: #fff; border-bottom-right-radius: 4px; }
  .chat-msgs .msg.bot { align-self: flex-start; background: #f2f2f4; color: var(--text); border-bottom-left-radius: 4px; }
  .chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  .chat-input input { flex: 1; border: 1px solid var(--border); border-radius: 999px; padding: 9px 14px; font-size: 13px; outline: none; min-width: 0; }
  .chat-input input:focus { border-color: var(--link); }
  .chat-input button { border: none; background: var(--link); color: #fff; border-radius: 999px; padding: 9px 16px; font-size: 13px; cursor: pointer; }
  .chat-input button:hover { background: var(--link-hover); }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-brand" href="#top">
      <span>智识资讯</span>
    </a>
    <div class="nav-links" id="nav-links"></div>
    <div class="nav-right">
      <button class="refresh-btn" id="refresh-btn">立即更新</button>
      <div class="nav-date" id="nav-date">—</div>
    </div>
  </div>
</nav>

<header class="hero" id="top">
  <canvas id="hero-canvas" aria-hidden="true"></canvas>
  <h1>今日智，今日识</h1>
  <p class="hero-en">Today’s AI, Today’s Insight</p>
  <p class="sub">汇当日 AI 讯息，Agent理序呈现</p>
  <div class="meta">
    <span>数据日期 <b id="news-date" style="color:var(--text)">—</b></span>
    <span><span class="dot"></span><span id="news-updated">每日清晨自动刷新</span></span>
  </div>
</header>

<main id="content"></main>

<footer>
  <span>Agent 自动生成</span><span class="sep">·</span>
  <span>每日定时更新</span><span class="sep">·</span>
  <span id="foot-count">—</span>
</footer>

<!-- 详情弹层 -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<!-- 聊天助手 -->
<button class="chat-launcher" id="chat-launcher" aria-label="打开助手"><span class="info-icon">i</span></button>
<div class="chat-panel" id="chat-panel">
  <div class="chat-head"><span><span class="badge"></span>AI 助手</span><button class="chat-close" id="chat-close" aria-label="关闭">✕</button></div>
  <div class="chat-quick" id="chat-quick">
    <button>今天最重要的新闻</button>
    <button>今天芯片硬件动态</button>
    <button>今天融资资本动态</button>
    <button>总结今天的AI动态</button>
  </div>
  <div class="chat-msgs" id="chat-msgs"></div>
  <div class="chat-input">
    <input id="chat-text" type="text" placeholder="问点关于今天新闻的…" />
    <button id="chat-send">发送</button>
  </div>
</div>

<script src="data/news.js"></script>
<script>
  const SECTION_DEFS = [
    { key: "硬件与芯片", title: "硬件与芯片", kicker: "Hardware & Silicon", desc: "GPU、AI 芯片、算力平台与终端硬件的最新进展" },
    { key: "模型与产品", title: "模型与产品", kicker: "Models & Products", desc: "大模型发布、Agent 产品与 AI 应用的新动态" },
    { key: "游戏AI", title: "游戏 AI", kicker: "AI in Gaming", desc: "AI 在游戏研发、玩法与 NPC 智能中的落地" },
    { key: "机器人具身智能", title: "机器人 · 具身智能", kicker: "Robotics", desc: "人形机器人、具身智能与物理 AI 的产业动态" },
    { key: "行业政策", title: "行业政策", kicker: "Policy & Governance", desc: "AI 治理、监管政策与行业规范" },
    { key: "资本与市场", title: "资本与市场", kicker: "Capital & Markets", desc: "融资、财报与 AI 产业资本动向" }
  ];

  let data = null;
  const PER_PAGE = 6;
  let sectionBatches = {};
  let groups = {};

  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderNav() {
    document.getElementById("nav-links").innerHTML = SECTION_DEFS.map(s =>
      `<a href="#sec-${s.key}">${s.title.replace(" · 具身智能", "")}</a>`).join("");
  }

  function render() {
    const news = data.news || [];
    renderNav();
    document.getElementById("news-date").textContent = data.date || "—";
    document.getElementById("news-updated").textContent = "更新时间：" + (data.updatedAt || data.date || "—");
    document.getElementById("foot-count").textContent = "共收录 " + news.length + " 条资讯";

    groups = {};
    news.forEach(n => { (groups[n.category] = groups[n.category] || []).push(n); });

    const main = document.getElementById("content");
    main.innerHTML = renderHotHTML() + SECTION_DEFS.map(s => renderSectionHTML(s.key)).join("");
    bindAll();
  }

  function renderHotHTML() {
    const hotNews = data.news.filter(n => n.hot);
    const list = hotNews.length ? hotNews.map(n => `
      <a class="hot-bar" href="#sec-${n.category}">
        <span class="chip ${n.category}">${n.category}</span>
        <span class="hot-bar-title">${esc(n.title)}</span>
        <span class="bar-arrow">›</span>
      </a>`).join("")
      : '<div class="empty-tip">今日暂无热门</div>';
    return `
      <section class="hot-section">
        <div class="sec-head reveal">
          <div class="sec-kicker">Today's Highlights</div>
          <h2>今日热门总览</h2>
          <p>多个来源交叉报道的当天大事</p>
        </div>
        <div class="hot-list">${list}</div>
      </section>`;
  }

  function renderSectionHTML(cat) {
    const sec = SECTION_DEFS.find(s => s.key === cat);
    const arr = groups[cat] || [];
    const total = Math.max(1, Math.ceil(arr.length / PER_PAGE));
    let cur = sectionBatches[cat] || 0;
    if (cur >= total) { cur = 0; sectionBatches[cat] = 0; }
    const items = arr.slice(cur * PER_PAGE, cur * PER_PAGE + PER_PAGE);
    const cards = items.length ? items.map((n) => `
      <article class="card reveal" data-i="${data.news.indexOf(n)}" tabindex="0" role="button" aria-label="${esc(n.title)}">
        ${n.hot ? '<span class="hot-badge">多源确认 · 热门</span>' : ""}
        <span class="chip ${cat}">${cat}</span>
        <h3>${esc(n.title)}</h3>
        <p class="sum">${esc(n.summary)}</p>
        <div class="foot">
          <span>${esc(n.source || "网络")} · ${n.date || ""}</span>
          <span class="more">阅读全文</span>
        </div>
      </article>`).join("")
      : '<div class="empty-tip">该分区暂无内容</div>';

    const batchBtn = total > 1 ? `
      <div class="section-batch-wrap">
        <button class="section-batch-btn" data-cat="${cat}">换一批 <span class="batch-count">${cur + 1} / ${total}</span></button>
      </div>` : "";

    return `
      <section class="section" id="sec-${cat}">
        <div class="sec-head reveal">
          <div class="sec-kicker">${sec.kicker}</div>
          <h2>${sec.title}</h2>
          <p>${sec.desc}</p>
        </div>
        <div class="grid">${cards}</div>
        ${batchBtn}
      </section>`;
  }

  function bindSection(sectionEl) {
    if (!sectionEl) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
    sectionEl.querySelectorAll(".reveal").forEach(el => io.observe(el));

    sectionEl.querySelectorAll(".card").forEach(card => {
      const open = () => openModal(+card.dataset.i);
      card.addEventListener("click", open);
      card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });

    const btn = sectionEl.querySelector(".section-batch-btn");
    if (btn) {
      btn.addEventListener("click", () => {
        const cat = btn.dataset.cat;
        sectionBatches[cat] = (sectionBatches[cat] || 0) + 1;
        const old = document.getElementById("sec-" + cat);
        const wrap = document.createElement("div");
        wrap.innerHTML = renderSectionHTML(cat);
        old.parentNode.replaceChild(wrap.firstElementChild, old);
        bindSection(document.getElementById("sec-" + cat));
      });
    }
  }

  function bindAll() {
    document.querySelectorAll(".hot-section, .section").forEach(el => bindSection(el));
  }

  function openModal(idx) {
    const n = data.news[idx];
    if (!n) return;
    const details = (n.detail || n.summary || "").split("\n").filter(Boolean)
      .map(p => `<p>${esc(p)}</p>`).join("");
    const modal = document.getElementById("modal");
    modal.innerHTML = `
      <button class="close-btn" id="modal-close" aria-label="关闭">✕</button>
      <span class="chip ${n.category}">${n.category}</span>
      <div class="m-date">${esc(n.source || "网络")}${n.date ? " · " + n.date : ""}</div>
      <h2>${esc(n.title)}</h2>
      <div class="m-sum">${esc(n.summary)}</div>
      <div class="m-detail">${details}</div>
      <div class="m-src">
        <span>${n.url ? "原文来自 " + esc(n.source || "网络") : "暂无原文链接"}</span>
        ${n.url ? `<a class="btn-link" href="${esc(n.url)}" target="_blank" rel="noopener">查看原文</a>` : ""}
      </div>`;
    document.getElementById("overlay").classList.add("open");
    document.body.classList.add("no-scroll");
    document.getElementById("modal-close").addEventListener("click", closeModal);
  }

  function closeModal() {
    document.getElementById("overlay").classList.remove("open");
    document.body.classList.remove("no-scroll");
  }

  document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  function load() {
    // 优先 fetch 最新数据（带时间戳绕过缓存），失败时回退到 news.js（file:// 双击场景）
    fetch("data/news.json?t=" + Date.now())
      .then(res => res.json())
      .then(d => { data = d; render(); })
      .catch(() => {
        if (window.__NEWS__) {
          data = window.__NEWS__;
          render();
        } else {
          document.getElementById("news-updated").textContent = "数据加载失败，请刷新重试";
          document.getElementById("content").innerHTML = '<div class="section"><div class="empty-tip">数据加载失败，请稍后刷新页面</div></div>';
        }
      });
  }
  load();

  // ===== Hero 背景：全球资讯向一点汇聚 =====
  (function () {
    const canvas = document.getElementById("hero-canvas");
    if (!canvas || !canvas.getContext) return;
    const ctx = canvas.getContext("2d");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const COLORS = ["0,102,204", "94,75,194", "14,122,98", "36,99,235"];
    let W = 0, H = 0, CX = 0, CY = 0;
    let visible = true;
    const particles = [];
    const ripples = [];
    const COUNT = 70;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = rect.width; H = rect.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      CX = W / 2;
      CY = H * 0.40;
    }

    function newParticle(seed) {
      const maxDim = Math.max(W, H);
      return {
        th: Math.random() * Math.PI * 2,
        R: maxDim * (0.62 + Math.random() * 0.45),
        t: seed ? Math.random() * 0.6 : 0,
        dur: 5 + Math.random() * 5,
        swirl: (0.25 + Math.random() * 0.75) * (Math.random() < 0.5 ? -1 : 1),
        color: COLORS[(Math.random() * COLORS.length) | 0],
        size: 1 + Math.random() * 1.6,
        trail: []
      };
    }

    function pos(p) {
      const k = 1 - p.t * p.t;
      const r = p.R * k;
      const a = p.th + p.swirl * p.t * 1.6;
      return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r * 0.72 };
    }

    function drawCenter(now) {
      const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 52);
      g.addColorStop(0, "rgba(0,102,204,0.10)");
      g.addColorStop(1, "rgba(0,102,204,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(CX, CY, 52, 0, Math.PI * 2); ctx.fill();

      const ph = (now / 3600) % 1;
      ctx.strokeStyle = "rgba(0,102,204," + (0.15 * (1 - ph)).toFixed(3) + ")";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(CX, CY, 12 + ph * 64, 0, Math.PI * 2); ctx.stroke();

      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.t += 0.007;
        if (rp.t >= 1) { ripples.splice(i, 1); continue; }
        const a = 0.30 * (1 - rp.t);
        ctx.strokeStyle = "rgba(" + rp.color + "," + a.toFixed(3) + ")";
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(CX, CY, 6 + rp.t * 118, 0, Math.PI * 2); ctx.stroke();
      }
    }

    function frame(now) {
      ctx.clearRect(0, 0, W, H);
      drawCenter(now);

      const dt = Math.min((now - (frame.last || now)) / 1000, 0.05);
      frame.last = now;

      for (const p of particles) {
        p.t += dt / p.dur;
        if (p.t >= 1) {
          if (ripples.length < 2 && Math.random() < 0.33) {
            ripples.push({ t: 0, color: p.color });
          }
          Object.assign(p, newParticle(false));
          continue;
        }
        const pt = pos(p);
        p.trail.push(pt);
        if (p.trail.length > 9) p.trail.shift();

        let al = 1;
        if (p.t < 0.12) al = p.t / 0.12;
        if (p.t > 0.82) al = Math.max(0, (1 - p.t) / 0.18);

        for (let i = 1; i < p.trail.length; i++) {
          const a = al * 0.30 * (i / p.trail.length);
          ctx.strokeStyle = "rgba(" + p.color + "," + a.toFixed(3) + ")";
          ctx.lineWidth = p.size * (i / p.trail.length);
          ctx.beginPath();
          ctx.moveTo(p.trail[i - 1].x, p.trail[i - 1].y);
          ctx.lineTo(p.trail[i].x, p.trail[i].y);
          ctx.stroke();
        }

        ctx.fillStyle = "rgba(" + p.color + "," + (al * 0.85).toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, p.size * (0.6 + al * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }
      if (visible && !reduceMotion) requestAnimationFrame(frame);
      else frame.last = undefined;
    }

    resize();
    addEventListener("resize", resize);
    for (let i = 0; i < COUNT; i++) particles.push(newParticle(true));

    if (reduceMotion) {
      ctx.clearRect(0, 0, W, H);
      drawCenter(0);
      for (const p of particles) {
        const pt = pos(p);
        ctx.fillStyle = "rgba(" + p.color + ",0.35)";
        ctx.beginPath(); ctx.arc(pt.x, pt.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      new IntersectionObserver((es) => {
        const was = visible;
        visible = es[0].isIntersecting;
        if (visible && !was) requestAnimationFrame(frame);
      }, { threshold: 0 }).observe(canvas.parentElement);
      requestAnimationFrame(frame);
    }
  })();

  // ===== 立即更新 =====
  async function refreshNow() {
    const btn = document.getElementById("refresh-btn");
    btn.disabled = true;
    btn.textContent = "更新中…";
    // 65 秒兜底超时（Vercel 函数上限 60 秒）
    const timer = setTimeout(() => {
      btn.textContent = "立即更新";
      btn.disabled = false;
      alert("更新超时了（抓取新闻比较慢，约需 1 分钟）。请稍后再试，或等每天 8 点的自动更新。");
    }, 65000);
    try {
      const res = await fetch("/api/refresh");
      const j = await res.json();
      clearTimeout(timer);
      if (j.ok) {
        data = j.data;
        sectionBatches = {};
        render();
        btn.textContent = "已更新";
        setTimeout(() => { btn.textContent = "立即更新"; btn.disabled = false; }, 2000);
      } else {
        alert("更新失败：" + (j.error || "未知错误"));
        btn.textContent = "立即更新";
        btn.disabled = false;
      }
    } catch (e) {
      clearTimeout(timer);
      alert("更新失败，请稍后重试。");
      btn.textContent = "立即更新";
      btn.disabled = false;
    }
  }
  document.getElementById("refresh-btn").addEventListener("click", refreshNow);

  // ===== 聊天助手 =====
  async function askDeepSeek(question) {
    const news = (data && data.news) || [];
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, news }),
    });
    const j = await res.json();
    if (!j.ok) return "调用失败：" + (j.error || "未知错误");
    return j.answer || "（空回复）";
  }

  const chatMsgs = document.getElementById("chat-msgs");
  function addMsg(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chatMsgs.appendChild(div);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
    return div;
  }

  async function sendChat(question) {
    question = (question || "").trim();
    if (!question) return;
    addMsg("user", question);
    const typing = addMsg("bot", "思考中…");
    try {
      typing.textContent = await askDeepSeek(question);
    } catch (e) {
      typing.textContent = "出错：" + (e.message || e);
    }
  }

  document.getElementById("chat-launcher").addEventListener("click", () => {
    document.getElementById("chat-panel").classList.toggle("open");
  });
  document.getElementById("chat-close").addEventListener("click", () => {
    document.getElementById("chat-panel").classList.remove("open");
  });
  document.querySelectorAll("#chat-quick button").forEach(btn => {
    btn.addEventListener("click", () => sendChat(btn.textContent));
  });
  document.getElementById("chat-send").addEventListener("click", () => {
    const input = document.getElementById("chat-text");
    sendChat(input.value);
    input.value = "";
  });
  document.getElementById("chat-text").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const input = document.getElementById("chat-text");
      sendChat(input.value);
      input.value = "";
    }
  });
</script>
</body>
